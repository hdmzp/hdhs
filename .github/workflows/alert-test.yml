name: 오류알림 테스트 발송

# 텔레그램 오류알림이 실제로 도착하는지 확인하는 수동 워크플로우.
# 수집 파이프라인이 실패해야만 알림이 오므로, 평소엔 형식/수신 여부를
# 확인할 방법이 없다 -> 여기서 예시 메시지를 직접 쏴본다.
# (봇 토큰/수신자 설정이 살아있는지 점검하는 용도로도 쓴다)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1이면 발송하지 않고 로그에 본문만 출력"
        required: false
        default: "0"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: 예시 오류알림 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WORKFLOW: rep-pgm-scrape.yml (셀럽PGM)
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python notify/send_alert.py --test
