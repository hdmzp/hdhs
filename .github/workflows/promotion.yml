name: 프로모션 카드할인 수집 (HD/GS/CJ/LT)

on:
  schedule:
    # 하루 2회: KST 06:20 / 12:50 (다른 워크플로우 크론과 겹치지 않게 분산)
    - cron: "20 21 * * *"   # KST 06:20 = UTC 21:20 (전날)
    - cron: "50 3 * * *"    # KST 12:50 = UTC 03:50
  workflow_dispatch:     # 수동 실행 버튼
    inputs:
      debug_snapshots:
        description: '렌더링 HTML 스냅샷 저장 (CJ/GS 파서 개선용)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write   # pages-deploy 워크플로우를 API로 dispatch하려면 필요

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      # 회사별 실패는 스크립트 내부에서 격리 처리되므로(status: failed로 기록)
      # 스텝 자체는 실패해도 커밋까지 진행한다 (실패 회사의 기존 데이터 보존).
      - name: 프로모션 카드할인 수집
        continue-on-error: true
        env:
          PROMO_DEBUG: ${{ inputs.debug_snapshots }}
        run: python promotion_scraper.py

      - name: 결과 커밋 & 푸시
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p homeshopping/promotions
          git add -A -- homeshopping/promotions
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 사항 없음"
            exit 0
          fi
          git commit -m "chore: 프로모션 카드할인 자동 갱신 $(date -u +%Y-%m-%d)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # 다른 워크플로우와 push 타이밍이 겹치면 non-fast-forward로
          # 실패할 수 있어 pull --rebase 재시도를 둔다.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 실패, rebase 후 재시도 ($i/5)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((RANDOM % 5 + 1))
          done
          echo "push 최종 실패"
          exit 1

      - name: Pages 재배포 트리거
        # github-actions[bot] 계정(GITHUB_TOKEN)으로 만든 push는 GitHub이
        # 다른 워크플로우를 재귀적으로 트리거하지 않아 workflow_dispatch를
        # API로 직접 호출해 배포를 강제로 큐에 넣는다.
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages-deploy.yml/dispatches" \
            -d '{"ref":"main"}'
