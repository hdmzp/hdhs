name: 텔레그램 아침 알림 (식품방송 + 어제 셀럽PGM)
on:
  schedule:
    # 평소 발송은 Cloudflare 봇(worker/telegram-bot.js onCron)이 매일 KST 07:00 에 workflow_dispatch 로 요청한다.
    # GitHub 예약은 3~6시간씩 밀려서(2026-11: 04:05 예약이 07:25~10:30 도착) 시계로 못 쓰고, 예비로만 둔다.
    # 예비: KST 08:00 = UTC 23:00(전날). 07:00 발송이 이미 나갔으면 check 단계에서 건너뛴다.
    - cron: "0 23 * * *"
  workflow_dispatch:  # 수동 실행 버튼 (테스트 발송용으로 하나만 골라 보낼 수 있다)
    inputs:
      only:
        description: "보낼 메시지 (all / food / ppl / celeb / category / brand)"
        required: false
        default: "all"
      admin_only:
        description: "관리자에게만 보내기 (테스트용 - 끄면 실제 받는 사람 모두에게)"
        type: boolean
        default: true
      scheduled:
        description: "정기 발송 (Cloudflare 봇이 07:00 에 요청할 때만 켜짐 - 손으로 실행할 땐 끈 채로)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  # 예비 예약 실행은 오늘 이미 보냈으면 건너뛴다 (봇의 /sent 로 확인)
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.sent.outputs.skip }}
    steps:
      - id: sent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          key=$(printf 'export:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -d' ' -f1)
          res=$(curl -fsS -m 20 -A hdhs-actions -H "Authorization: Bearer $key" https://hdhs-bot.mj2040354.workers.dev/sent || echo '{}')
          echo "$res"
          if echo "$res" | grep -q '"sent":true'; then echo "오늘 이미 보냄 - 건너뜀"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
  send:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 받는 사람이 늘어도 끝까지 보내도록 넉넉히 (한 명당 메시지 6~7건 x 0.3초 쉼 -> 30분이면 수백 명)
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install requests
      - name: 텔레그램 발송 — 식품방송 리스트
        if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'food'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.admin_only && '1' || '' }}  # 수동 테스트는 관리자에게만
          # 표시할 회사/시간대를 바꾸려면 저장소 Variables 에 등록
          # 예: COMPANIES=HD,GS,CJ,LT / TIME_START=06:00 / TIME_END=23:59
          COMPANIES: ${{ vars.COMPANIES }}
          TIME_START: ${{ vars.TIME_START }}
          TIME_END: ${{ vars.TIME_END }}
          WEATHER_REGION: ${{ vars.WEATHER_REGION }}
        run: python notify/send_daily_food.py
      # 오늘의 건강프로그램 PPL 예고 (식품 리스트를 받는 사람에게, 별도 메시지)
      # 2026-10-31 사용자 요청으로 매일 예약 발송에서 뺐다 - 수동 실행(only=ppl)일 때만 보낸다
      - name: 텔레그램 발송 — 건강프로그램 PPL 예고
        if: always() && github.event_name == 'workflow_dispatch' && inputs.only == 'ppl'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.admin_only && '1' || '' }}  # 수동 테스트는 관리자에게만
          COMPANIES: ${{ vars.COMPANIES }}
        run: python notify/send_health_ppl.py
      # 어제의 셀럽PGM 운영상품 (식품 리스트와 별도 메시지)
      # 식품 발송이 실패해도 이건 따로 보낸다
      - name: 텔레그램 발송 — 어제 셀럽PGM 운영상품
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'celeb')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.admin_only && '1' || '' }}  # 수동 테스트는 관리자에게만
        run: python notify/send_celeb_daily.py
      # 오늘의 패션·리빙·미용 방송 리스트 (게스트 💗)
      # 봇에서 그 카테고리를 골라 승인된 사람에게만 간다 (notify/subscribers.py)
      - name: 텔레그램 발송 — 패션·리빙·미용 방송 리스트
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'category')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.admin_only && '1' || '' }}  # 수동 테스트는 관리자에게만
          COMPANIES: ${{ vars.COMPANIES }}
          TIME_START: ${{ vars.TIME_START }}
          TIME_END: ${{ vars.TIME_END }}
          # 새 게스트 후보: 월요일 자동 + 손으로 실행할 때마다 (관리자에게만)
          GUEST_CANDIDATES: ${{ github.event_name == 'workflow_dispatch' && !inputs.scheduled && '1' || '' }}
        run: python notify/send_daily_category.py
      # 🔔 관심 브랜드 - 봇에서 브랜드를 등록한 사람마다, 오늘 4사 편성에 있을 때만 (notify/send_brand_alert.py)
      - name: 텔레그램 발송 — 관심 브랜드
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'brand')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.admin_only && '1' || '' }}  # 수동 테스트는 관리자 본인 것만
          COMPANIES: ${{ vars.COMPANIES }}
          TIME_START: ${{ vars.TIME_START }}
          TIME_END: ${{ vars.TIME_END }}
        run: python notify/send_brand_alert.py
      # 오늘 보냈다고 봇에 표시 (예비 예약이 같은 알림을 또 보내지 않게). 정기 발송일 때만.
      - name: 오늘 발송 표시
        if: always() && (github.event_name == 'schedule' || inputs.scheduled)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          key=$(printf 'export:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -d' ' -f1)
          curl -fsS -m 20 -X POST -A hdhs-actions -H "Authorization: Bearer $key" https://hdhs-bot.mj2040354.workers.dev/sent || echo "표시 실패 (예비 예약이 한 번 더 보낼 수 있음)"
      # 셀럽PGM 상품리스트 발송은 2026-07 사용자 요청으로 제거
      # (다시 켜려면: python notify/send_celeb_pgm.py 스텝 복원 - 스크립트는 남겨둠)
