name: 텔레그램 아침 알림 (식품방송 + 어제 셀럽PGM)
on:
  schedule:
    # 매일 KST 04:05 = UTC 19:05(전날)
    # GitHub cron은 실제로 2~4시간씩 밀린다 (2026-10: 08:30 예약이 10:20~12:40에 도착).
    # 8시 전에 받도록 새벽으로 당긴다. 정각은 예약이 가장 몰려서 5분 비켰고,
    # 같은 시간대 다른 예약(고정PGM 수집 UTC 19:30)과도 겹치지 않는다.
    # 날씨는 전날 받은 예보(weather.yml, KST 05:30 갱신)에 오늘 날짜가 들어 있다.
    - cron: "5 19 * * *"
  workflow_dispatch:  # 수동 실행 버튼 (테스트 발송용으로 하나만 골라 보낼 수 있다)
    inputs:
      only:
        description: "보낼 메시지 (all / food / ppl / celeb / category / brand)"
        required: false
        default: "all"
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install requests
      - name: 텔레그램 발송 — 식품방송 리스트
        if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'food'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUBS_URL: ${{ vars.SUBS_URL }}  # 봇 구독자 목록 (Cloudflare Worker, notify/subscribers.py)
          SUBS_KEY: ${{ secrets.SUBS_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 표시할 회사/시간대를 바꾸려면 저장소 Variables 에 등록
          # 예: COMPANIES=HD,GS,CJ,LT / TIME_START=06:00 / TIME_END=23:59
          COMPANIES: ${{ vars.COMPANIES }}
          TIME_START: ${{ vars.TIME_START }}
          TIME_END: ${{ vars.TIME_END }}
          WEATHER_REGION: ${{ vars.WEATHER_REGION }}
        run: python notify/send_daily_food.py
      # 오늘의 건강프로그램 PPL 예고 (식품 리스트를 받는 사람에게, 별도 메시지)
      # 2026-10-31 사용자 요청으로 매일 예약 발송에서 뺐다 - 수동 실행(only=ppl)일 때만 보낸다
      - name: 텔레그램 발송 — 건강프로그램 PPL 예고
        if: always() && github.event_name == 'workflow_dispatch' && inputs.only == 'ppl'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUBS_URL: ${{ vars.SUBS_URL }}  # 봇 구독자 목록 (Cloudflare Worker, notify/subscribers.py)
          SUBS_KEY: ${{ secrets.SUBS_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMPANIES: ${{ vars.COMPANIES }}
        run: python notify/send_health_ppl.py
      # 어제의 셀럽PGM 운영상품 (식품 리스트와 별도 메시지)
      # 식품 발송이 실패해도 이건 따로 보낸다
      - name: 텔레그램 발송 — 어제 셀럽PGM 운영상품
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'celeb')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUBS_URL: ${{ vars.SUBS_URL }}  # 봇 구독자 목록 (Cloudflare Worker, notify/subscribers.py)
          SUBS_KEY: ${{ secrets.SUBS_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify/send_celeb_daily.py
      # 오늘의 패션·리빙·미용 방송 리스트 (게스트 💗)
      # 봇에서 그 카테고리를 신청한 사람에게만 간다 (notify/subscribers.py)
      - name: 텔레그램 발송 — 패션·리빙·미용 방송 리스트
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'category')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUBS_URL: ${{ vars.SUBS_URL }}  # 봇 구독자 목록 (Cloudflare Worker, notify/subscribers.py)
          SUBS_KEY: ${{ secrets.SUBS_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMPANIES: ${{ vars.COMPANIES }}
          TIME_START: ${{ vars.TIME_START }}
          TIME_END: ${{ vars.TIME_END }}
          # 새 게스트 후보: 월요일 자동 + 수동 실행 때마다 (관리자에게만)
          GUEST_CANDIDATES: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python notify/send_daily_category.py
      # 봇에서 /brand 로 등록한 브랜드의 오늘 방송 (사람마다 따로)
      - name: 텔레그램 발송 — 브랜드 방송 알림
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'brand')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUBS_URL: ${{ vars.SUBS_URL }}  # 봇 구독자 목록 (Cloudflare Worker, notify/subscribers.py)
          SUBS_KEY: ${{ secrets.SUBS_KEY }}
          COMPANIES: ${{ vars.COMPANIES }}
          TIME_START: ${{ vars.TIME_START }}
          TIME_END: ${{ vars.TIME_END }}
        run: python notify/send_brand_alerts.py
      # 셀럽PGM 상품리스트 발송은 2026-07 사용자 요청으로 제거
      # (다시 켜려면: python notify/send_celeb_pgm.py 스텝 복원 - 스크립트는 남겨둠)
