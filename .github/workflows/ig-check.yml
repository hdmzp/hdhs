name: 고정PGM 인스타 계정 점검

on:
  schedule:
    # 매주 화요일 한국시간(KST) 03:17 = 월요일 UTC 18:17.
    - cron: "17 18 * * 1"
  workflow_dispatch: {}  # 수동 실행 버튼

permissions:
  contents: write
  actions: write   # pages-deploy 워크플로우를 API로 dispatch하려면 필요

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      # 모든 계정이 접속 실패(러너 IP 차단 추정)면 이전 결과를 유지하고
      # 종료코드 1을 낸다. 기록은 남겨야 하므로 커밋 후 실패 처리한다.
      - name: 인스타 계정 점검
        id: check
        continue-on-error: true
        run: python -u fixed/ig_check.py

      - name: 변경사항 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fixed/ig_status.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: 고정PGM 인스타 계정 점검 결과 ($(date -u +%Y-%m-%d))"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push 실패, 재시도 ($i)"
            sleep $((RANDOM % 10 + 1))
          done

      - name: Pages 재배포 트리거
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages-deploy.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: 점검 실패 시 잡 실패 처리
        if: steps.check.outcome == 'failure'
        run: |
          echo "인스타그램 접속이 전부 막혔습니다 (러너 차단 추정). 이전 결과를 유지했습니다."
          exit 1
