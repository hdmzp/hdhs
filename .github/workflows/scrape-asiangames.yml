name: 아시안게임 일정 수집

on:
  schedule:
    # 대회 기간에만 의미가 있는 수집이라 하루 2회면 충분하다.
    # KST 07:00(=UTC 22:00 전날), KST 19:00(=UTC 10:00)
    - cron: "0 22 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "정찰 모드 (파일을 쓰지 않고 네이버 응답 구조만 로그로 확인)"
        type: boolean
        default: false
      dates:
        description: "특정 날짜만 수집 (쉼표 구분, 예: 2026-09-20,2026-09-21). 비우면 대회 전체 기간"
        type: string
        default: ""

permissions:
  contents: write
  actions: write   # pages-deploy 워크플로우를 API로 dispatch하려면 필요

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      # 폐회식(2026-10-04) 다음 날부터는 일정이 더 바뀌지 않으므로
      # 스케줄 실행을 그냥 건너뛴다. 워크플로우 파일을 지우러 들어올
      # 필요 없이 알아서 멈춘다. (수동 실행은 언제든 가능)
      - name: 대회 종료 여부 확인
        id: window
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$TODAY" \> "2026-10-05" ]; then
            echo "대회 종료($TODAY) — 스케줄 실행을 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Python 설치
        if: steps.window.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        if: steps.window.outputs.skip == 'false'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 수집 실행
        if: steps.window.outputs.skip == 'false'
        run: |
          cd scraper
          ARGS="--out-dir ../data/asiangames"
          if [ "${{ inputs.probe }}" = "true" ]; then ARGS="$ARGS --probe"; fi
          if [ -n "${{ inputs.dates }}" ]; then ARGS="$ARGS --dates ${{ inputs.dates }}"; fi
          echo "python asiangames_scraper.py $ARGS"
          python asiangames_scraper.py $ARGS

      - name: 변경사항 커밋
        id: commit
        if: steps.window.outputs.skip == 'false' && inputs.probe != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/asiangames/*.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: 아시안게임 일정 데이터 갱신 ($(date -u +%Y-%m-%d))"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "push 실패, 재시도 ($i)"
            sleep $((RANDOM % 10 + 1))
          done

      - name: Pages 재배포 트리거
        # github-actions[bot] 계정(GITHUB_TOKEN)으로 만든 push는 GitHub이
        # 다른 워크플로우를 재귀적으로 트리거하지 않으므로, 배포를 직접 건다.
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages-deploy.yml/dispatches" \
            -d '{"ref":"main"}'
