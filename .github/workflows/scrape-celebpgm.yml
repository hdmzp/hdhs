name: Scrape Celebrity PGM Products

on:
  schedule:
    # UTC 기준 18:00는 한국 시간(KST)으로 다음날 새벽 03:00입니다.
    - cron: '0 18 * * *'
  workflow_dispatch: # 필요할 때 깃허브에서 수동으로도 가동할 수 있는 버튼을 활성화합니다.

permissions:
  contents: write
  actions: write   # pages-deploy 워크플로우를 API로 dispatch하려면 필요

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    # 1. 레포지토리 코드 체크아웃
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 파이썬 환경 설정 (3.10 버전 권장)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # 패키지 설치 속도 최적화

    # 3. 필수 의존성 패키지 설치
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 playwright

    # 4. Playwright 브라우저 및 시스템 필수 라이브러리 설치 (rehd.py 구동용)
    - name: Install Playwright Browsers
      run: |
        playwright install chromium
        playwright install-deps chromium

    # 4-1. 건전성 검사 기준 시각 기록 (수집 직전)
    - name: 수집 시작 시각 기록
      run: python tools/check_scrape_health.py --mark

    # 5. fixed 폴더 내 4개 파이썬 스크립트 가동 (오류 발생해도 다음 스크립트 계속 실행)
    #    개별 실패를 '|| echo'로 삼키므로, 아래 건전성 검사가 산출물을 보고
    #    실제 수집 여부를 판정한다.
    - name: Run Scrapers in fixed folder
      run: |
        echo "GS 지금 백지연 수집 시작..."
        python tools/run_step.py fixed/regs.py

        echo "CJ 대표 PGM(강주은, 최화정, 김창옥) 수집 시작..."
        python tools/run_step.py fixed/recj.py

        echo "HD 대표 PGM(황정민쇼, 오감쇼) 수집 시작..."
        python tools/run_step.py fixed/rehd.py

        echo "LT 최유라쇼 수집 시작..."
        python tools/run_step.py fixed/relt.py

        echo "셀럽PGM merged.json 갱신..."
        python fixed/build_representative_programs.py || echo "merged.json 갱신 중 실패 발생"

        echo "셀럽PGM 월별 누적(history) 갱신..."
        python fixed/build_celeb_history.py || echo "월별 누적 갱신 중 실패 발생"

    # 5-1. 산출물 검사 - 갱신 안 된 파일/빈 파일/급감을 잡는다.
    #      성공한 회사 데이터는 커밋해서 살리고, 잡은 마지막에 실패 처리한다.
    - name: 수집 건전성 검사
      id: health
      continue-on-error: true
      run: python tools/check_scrape_health.py --group celeb

    # 6. 생성된 JSON 데이터를 깃허브 레포지토리에 자동으로 Commit & Push
    #    다른 워크플로우(랭킹/기타채널 등)와 push 타이밍이 겹치면
    #    non-fast-forward로 거부된다. 2026-08-12 실행이 이걸로 죽었다
    #    (수집은 다 성공했는데 push만 실패해서 데이터가 통째로 날아감).
    #    그래서 rebase 재시도 루프 + 소진 시 재동기화 1회를 둔다.
    - name: Commit and Push JSON Data
      id: commit
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # 변경되거나 새롭게 생성된 JSON 파일이 있는지 확인 후 스테이징
        # (history/ 하위 방송회차별 누적 파일 포함)
        git add homeshopping/representative_programs/ || true

        # 변경사항이 없으면 커밋할 것도 없다
        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "업데이트된 데이터 변경 사항이 없습니다."
          exit 0
        fi

        git commit -m "🤖 [Automated] 새벽 3시 셀럽 PGM 데이터 정기 업데이트"
        echo "changed=true" >> "$GITHUB_OUTPUT"

        for i in 1 2 3 4 5; do
          if git push; then
            echo "push 성공"
            exit 0
          fi
          echo "push 실패, rebase 후 재시도 ($i/5)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
          sleep $((RANDOM % 5 + 1))
        done

        # 재시도를 다 소진했을 때의 마지막 1회.
        # 루프가 실패하는 흔한 원인이 rebase가 어중간하게 남아있거나 로컬
        # ref가 원격보다 뒤처진 상태라, 원격을 새로 받아 그 위에 확실히
        # 얹은 뒤 한 번 더 시도한다.
        echo "재시도 소진 - 원격 재동기화 후 마지막 1회 시도"
        git rebase --abort 2>/dev/null || true
        git fetch origin "${GITHUB_REF_NAME}"
        if git rebase "origin/${GITHUB_REF_NAME}" && git push; then
          echo "추가 시도에서 push 성공"
          exit 0
        fi

        echo "push 최종 실패"
        exit 1

    # 6-1. github-actions[bot]의 push는 다른 워크플로우를 재귀 트리거하지 않아
    #      (README '2. 자동화 파이프라인' 참고) 이 스텝이 없으면 이 워크플로우만
    #      도는 날은 수집은 됐는데 사이트에 반영이 안 된다. 실제로 2026-08-20
    #      최은경쇼 첫 수집분이 push까지 되고도 배포가 안 돼서 화면에 안 보였다.
    #      -> 대표PGM 워크플로우(rep-pgm-scrape.yml)와 같이 배포를 API로 큐에 넣는다.
    - name: Pages 재배포 트리거
      if: steps.commit.outputs.changed == 'true'
      run: |
        curl -L -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages-deploy.yml/dispatches" \
          -d '{"ref":"main"}'

    # 7. 실패를 드러낸다 - 잡 실패 처리

    - name: 건전성 검사 실패 시 잡 실패 처리
      if: steps.health.outcome == 'failure'
      run: |
        echo "수집 건전성 검사에서 문제가 발견됐습니다:"
        echo "${{ steps.health.outputs.failures }}"
        exit 1
