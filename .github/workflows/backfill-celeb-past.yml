name: 셀럽PGM 지난 회차 소급 (1회성)

# 중간 편입 셀럽PGM(림잇티드/더퍼스트 유난희)의 편입일 ~ 첫 수집일 사이
# 회차를 history에 채운다. CJ는 편성표 API를 과거 날짜로 다시 조회해야
# 해서 Actions에서 돌린다. 이미 있는 회차는 안 건드려 여러 번 돌려도 안전.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # pages-deploy 워크플로우를 API로 dispatch하려면 필요

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests beautifulsoup4

      - name: 지난 회차 소급
        run: python tools/backfill_celeb_past.py --apply

      - name: 변경사항 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add homeshopping/representative_programs/history/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: 셀럽PGM 지난 회차 소급 (림잇티드/더퍼스트 유난희)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push 실패, 재시도 ($i)"
            sleep $((RANDOM % 10 + 1))
          done

      - name: Pages 재배포 트리거
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages-deploy.yml/dispatches" \
            -d '{"ref":"main"}'
