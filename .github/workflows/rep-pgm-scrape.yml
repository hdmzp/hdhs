name: Representative PGM Scrape

on:
  schedule:
    # 매일 KST 08:10 (UTC 23:10 전날) — 고정PGM/랭킹 크론과 겹치지 않게 분산
    - cron: '10 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # pages-deploy 워크플로우를 API로 dispatch하려면 필요

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      # 회사별 스크레이퍼는 각자 독립 실행: 하나가 실패(사이트 구조 변경,
      # WAF 차단 등)해도 나머지 결과는 그대로 살아남아야 하므로
      # continue-on-error로 격리한다.
      - name: Scrape HD (Playwright)
        continue-on-error: true
        run: python fixed/rehd.py

      - name: Scrape GS
        continue-on-error: true
        run: python fixed/regs.py

      - name: Scrape LT
        continue-on-error: true
        run: python fixed/relt.py

      - name: Scrape CJ
        continue-on-error: true
        run: python fixed/recj.py

      - name: Build merged.json
        run: python fixed/build_representative_programs.py

      # 월 조회용: 프로그램별 방송 상품을 방송일자 기준 월 파일에 누적
      - name: Build monthly celeb history
        run: python fixed/build_celeb_history.py

      # 다른 워크플로우(랭킹/기타채널 등)와 push 타이밍이 겹치면
      # non-fast-forward로 실패할 수 있어 pull --rebase 재시도를 둔다.
      - name: Commit & push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add homeshopping/representative_programs/

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 사항 없음"
            exit 0
          fi

          git commit -m "chore: update representative programs data"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 실패, rebase 후 재시도 ($i/5)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((RANDOM % 5 + 1))
          done

          echo "push 최종 실패"
          exit 1

      # github-actions[bot]의 push는 다른 워크플로우를 재귀 트리거하지 않아
      # (README '2. 자동화 파이프라인' 참고) 이 스텝이 없으면 셀럽PGM 데이터만
      # 갱신된 날은 사이트에 반영이 안 된다 -> 배포를 API로 직접 큐에 넣는다.
      - name: Pages 재배포 트리거
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages-deploy.yml/dispatches" \
            -d '{"ref":"main"}'
