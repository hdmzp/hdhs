name: "[임시] 회차 소개글 수집 테스트"
on:
  push:
    branches: [ccr-25350af0-w3rmp4]
    paths: [tools/probe_episode.py, .github/workflows/probe-episode.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests beautifulsoup4
      - run: python tools/probe_episode.py
